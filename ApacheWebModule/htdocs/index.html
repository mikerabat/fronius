<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Solar">
  <title>Solar Monitor</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/common.js"></script>
  <script src="libs/echarts.min.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span id="brand-logo"></span>Solar Monitor</div>
      <div class="spacer"></div>
      <button id="btn-theme" class="btn btn-icon" type="button" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten" data-icon="theme"></button>
      <div class="user-chip"><span class="avatar" id="avatar">?</span><span id="uname"></span></div>
      <button id="btn-logout" class="btn" type="button" title="Abmelden"><span data-icon="logout"></span><span class="lbl-logout">Abmelden</span></button>
    </div>
  </header>

  <main class="container">

    <!-- ============ Live ============ -->
    <section class="card" aria-labelledby="h-live">
      <div class="card-head">
        <h2 id="h-live">Aktuell</h2>
        <span class="sub"><span id="live-dot" class="live-dot"></span><span id="live-time">verbinde …</span></span>
      </div>
      <div class="live-grid">
        <svg id="flow" class="flow" role="img" aria-label="Energiefluss zwischen Solaranlage, Haus und Netz"></svg>

        <div class="live-side">
          <div class="ring-row">
            <div class="ring-tile" id="rt-autarky">
              <svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" stroke="var(--c-self)"/><text x="32" y="33">–</text></svg>
              <div><div class="t">Autarkie</div><div class="d">Verbrauch aus PV</div></div>
            </div>
            <div class="ring-tile" id="rt-selfcons">
              <svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" stroke="var(--c-pv)"/><text x="32" y="33">–</text></svg>
              <div><div class="t">Eigenverbrauch</div><div class="d">PV selbst genutzt</div></div>
            </div>
          </div>
          <div class="kv" id="live-kv">
            <div class="kv-row"><span class="swatch" style="background:var(--c-self)"></span>PV direkt genutzt<b id="k-self">–</b></div>
            <div class="kv-row"><span class="swatch" style="background:var(--c-pv)"></span>Einspeisung<b id="k-export">–</b></div>
            <div class="kv-row"><span class="swatch" style="background:var(--c-grid)"></span>Netzbezug<b id="k-import">–</b></div>
          </div>
          <div>
            <div class="card-head" style="margin:6px 0 2px"><span class="sub">Heute bisher</span></div>
            <div class="kv" id="today-kv">
              <div class="kv-row">Produktion<b id="t-prod">–</b></div>
              <div class="kv-row">Verbrauch<b id="t-cons">–</b></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ Verlauf ============ -->
    <section class="card" aria-labelledby="h-hist">
      <div class="card-head"><h2 id="h-hist">Verlauf</h2></div>
      <div class="toolbar">
        <div class="seg" role="tablist" aria-label="Zeitraum">
          <button role="tab" data-view="day"   aria-selected="true">Tag</button>
          <button role="tab" data-view="month" aria-selected="false">Monat</button>
          <button role="tab" data-view="year"  aria-selected="false">Jahr</button>
          <button role="tab" data-view="total" aria-selected="false">Gesamt</button>
        </div>
        <div class="period-nav" id="period-nav">
          <button class="btn btn-icon" id="btn-prev" type="button" aria-label="Zurück" data-icon="left"></button>
          <div class="period-label" id="period-label">–</div>
          <button class="btn btn-icon" id="btn-next" type="button" aria-label="Weiter" data-icon="right"></button>
          <span class="btn btn-icon date-pick" id="date-pick" title="Datum wählen"><span data-icon="calendar"></span><input type="date" id="date-input" aria-label="Datum wählen"></span>
          <button class="btn" id="btn-today" type="button">Heute</button>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>

      <div id="chart" class="chart" role="img" aria-label="Diagramm"></div>
      <div class="chart-foot">
        <span id="chart-note"></span>
        <span class="spacer"></span>
        <button class="btn" id="btn-table" type="button" aria-expanded="false"><span data-icon="table"></span>Tabelle</button>
      </div>
      <div id="table" class="table-wrap hidden"></div>
    </section>
  </main>
</body>
</html>
